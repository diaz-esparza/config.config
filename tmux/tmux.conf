set -g allow-passthrough on
# True color
set-option -sa terminal-overrides ",xterm*:Tc"
# Mosh + tmux
set-option -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c%p1%.0s;%p2%s\\7"
set -g set-clipboard on

# Prefix @ space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g renumber-windows on
set -g history-limit 10000
set -g status-position top

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes @ 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'dracula/tmux'

# set vi-mode
set-window-option -g mode-keys vi
# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# New panes in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Dracula opts
set -g @dracula-show-powerline true
set -g @dracula-transparent-powerline-bg false
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-flags true

set -g @dracula-cpu-usage-label "cpu"
set -g @dracula-ram-usage-label "ram"

set -g @dracula-military-time true
set -g @dracula-day-month true
set -g @dracula-set-timezone ""
set -g @dracula-show-timezone false

set -g @dracula-show-left-icon session
#set -g @dracula-border-contrast true

set -g @dracula-cpu-usage-colors "dark_purple white"
set -g @dracula-ram-usage-colors "dark_purple white"
set -g @dracula-time-colors "green dark_gray"

# Theme: swap the file name to switch (see ~/.config/tmux/themes/)
source-file ~/.config/tmux/themes/pink.conf

# Machine-specific overrides (not tracked)
source-file -q ~/.config/tmux/local.conf

# Bootstrap TPM on fresh machines, then initialize it (keep at the very bottom)
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
